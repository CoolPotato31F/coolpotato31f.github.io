<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <meta charset="utf-8">
</head>
<body>
    <h2>Login</h2>
    <div id="message"></div>

    <form id="loginForm">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <button type="submit">Login</button>
    </form>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault(); // stop default redirect

            const formData = new FormData(this);
            const response = await fetch("/login", {
                method: "POST",
                body: formData
            });

            if (response.ok) {
                // If login succeeded, replace page with dashboard.html
                const dashboard = await fetch("/static/dashboard.html");
                document.body.innerHTML = await dashboard.text();
            } else {
                // Show error message
                document.getElementById("message").innerHTML = "Invalid credentials!";
            }
        });
    </script>
</body>
</html>
