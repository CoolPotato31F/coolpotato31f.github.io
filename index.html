<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WebSocket Loader</title>
  <style>
    body {
      margin: 0;
      font-family: monospace;
      background: #0f1724;
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="status">Connecting to server...</div>
  <iframe id="contentFrame" style="display:none;"></iframe>

  <script>
    const socket = new WebSocket("wss://sepaled-miller-nonvigilantly.ngrok-free.app");

    socket.onopen = () => {
      document.getElementById("status").textContent = "Connected. Waiting for content...";
    };

    socket.onmessage = (event) => {
      // Assume server sends back raw HTML to display
      const frame = document.getElementById("contentFrame");
      frame.style.display = "block";
      document.getElementById("status").style.display = "none";

      // Write received HTML into iframe
      const doc = frame.contentDocument || frame.contentWindow.document;
      doc.open();
      doc.write(event.data);
      doc.close();
    };

    socket.onclose = () => {
      document.getElementById("status").textContent = "Connection closed.";
    };

    socket.onerror = (err) => {
      console.error("WebSocket error:", err);
      document.getElementById("status").textContent = "Error connecting to server.";
    };
  </script>
</body>
</html>
